<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ 流星雨 · 许愿池</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070f;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            touch-action: none; /* 防止手机滑动页面 */
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 顶部标题装饰 */
        .title {
            position: fixed;
            top: 8%;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: clamp(16px, 4vw, 24px);
            letter-spacing: 6px;
            font-weight: 300;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(120, 180, 255, 0.6);
            animation: glow 3s infinite alternate ease-in-out;
        }

        @keyframes glow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 6%;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: clamp(12px, 3vw, 15px);
            letter-spacing: 3px;
            z-index: 2;
            pointer-events: none;
            animation: hintPulse 2.5s infinite alternate ease-in-out;
        }

        @keyframes hintPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>
    <div class="title">星 河 入 梦</div>
    <div class="hint">轻触屏幕 · 流星许愿</div>

            const canvas = document.getElementById('sky');
            const ctx = canvas.getContext('2d');

            // ========== 全局尺寸 ==========
            let W = 0, H = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制最大2倍，保证性能

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                initStars();

            let stars = [];

                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.9,   // 上方90%区域
                        r: Math.random() * 1.4 + 0.3,
                        alpha: Math.random() * 0.6 + 0.2,
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars(t) {
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    // 闪烁：用正弦改变透明度
                    const a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.twinkleSpeed + s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 240, ${a})`;
                    ctx.fill();
                }
            }
